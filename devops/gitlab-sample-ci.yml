        - ${APP_NAME}/**/*
    - if: $DEV_IMAGE_APP == "OTEL"

tag-source:
  stage: tag
  image: devops-dev.registry.ews.int/ews-cm/cm-ubi-java-mvn-gradle:jdk_${JDK}_mvn_${MAVEN_INSTALL_VERSION}_gradle_${GRADLE_INSTALL_VERSION}_nodejs_${NODEJS_VERSION}
  tags:
    - shared-shell-docker
  variables:
    GIT_DEPTH: 10
  script:
    - |
      echo "$CI_COMMIT_BRANCH branch detected, attempting to create git tag"      
      git config user.email "project_${CI_PROJECT_ID}_bot" 
      git config user.name "project${CI_PROJECT_ID}_bot@example.com"                       
      if git config remote.central.url > /dev/null; then
        echo "remove existing remote and procceed"
        git remote rm central && git remote add central https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
      else
        echo "adding remote and procceed"
        git remote add central https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
      fi
      echo "add a tag - ${CI_COMMIT_BRANCH}-${CI_PIPELINE_ID} "      
      git tag -f -a "${CI_COMMIT_BRANCH}-${CI_PIPELINE_ID}" -m "Tagged by CI pipeline: ${CI_PIPELINE_ID} branch: ${CI_COMMIT_BRANCH} "   
      git push central --tags --verbose
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|release.*|hotfix.*)$/
    - if: $DEV_IMAGE_APP == "GATEWAY"
    - if: $DEV_IMAGE_APP == "WIREMOCK"
    - if: $DEV_IMAGE_APP == "OTEL"
    - when: never
