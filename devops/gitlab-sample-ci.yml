include:
  - project: 'security/security-ci-includes'
    file: 'security.yml'
    rules:
      - if: $CI_COMMIT_BRANCH =~ /^(main|release.*|hotfix.*|)$/

variables:
  ARTIFACTORY_BASE_URL: "https://jfrog-artifactory.ews.int/artifactory/helm-api-gateway-dev"
  SECURE_ANALYZERS_PREFIX: "security-dev.registry.ews.int/vendored/registry.gitlab.com/gitlab-org/security-products/analyzers"
  VERACODE_FILEPATH: "build/libs/*.jar"
  VERACODE_APP_NAME: "api-gateway"
  SRC_DIR_FILES: "src/*"
  PROXY_HOST: "corpwproxy.ews.int"
  PROXY_PORT: 8080
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  MAVEN_INSTALL_VERSION: "3.6.3"
  JDK: "java-11-openjdk-devel"
  GRADLE_INSTALL_VERSION: "7.4.1"
  NODE_VERSION: "16"
  NODEJS_VERSION: "16"

stages:
  - scan
  - helm-push-gateway
  - helm-push-wiremock
  - helm-push-otel
  - tag

helm-push-gateway:
  stage: helm-push-gateway
  image: devops-dev.registry.ews.int/pks/helm:3.5.4
  tags:
    - helm
  variables:
    APP_NAME: "tyk-gateway"
  before_script:
    - |
      if [ -d ${APP_NAME} ]; then
        echo "${APP_NAME} Helm folder found - proceeding with upload."
      else
        echo "Helm folder NOT found - skipping upload."
        exit 1
      fi
  script:
    - helm package ${APP_NAME}  --app-version=${CI_PIPELINE_ID} --version=${CI_PIPELINE_ID}
    # Upload path per https://early-warning.atlassian.net/wiki/spaces/APIA/pages/90566133950/Jfrog+Artifactory+Docker+Registry+and+Repository+Structure#Helm-Repository-Structure
    - curl -v -X PUT --user ${JFROG_USER}:${JFROG_PASS} --upload-file ${APP_NAME}-${CI_PIPELINE_ID}.tgz ${ARTIFACTORY_BASE_URL}/${APP_NAME}/${APP_NAME}-${CI_PIPELINE_ID}.tgz
  allow_failure: true     # If no Helm folder, this stage will fail (and that is okay)
  rules:                  # Further, this stage should only run if there are Helm changes
    - if: $CI_COMMIT_BRANCH =~ /^(main|release.*|hotfix.*)$/
      changes:
        - ${APP_NAME}/**
        - ${APP_NAME}/**/*
    - if: $DEV_IMAGE_APP == "GATEWAY"

